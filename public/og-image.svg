<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Status pill -->
  <rect x="100" y="90" width="310" height="38" rx="19" fill="#292524" stroke="#44403c" stroke-width="1.5" />
  <circle cx="124" cy="109" r="6" fill="#f59e0b" />
  <text x="142" y="115" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1">AVAILABLE FOR AUDITS</text>

  <!-- Headline -->
  <text x="100" y="210" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">ABAYOMI</text>
  <text x="100" y="280" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="700">Autonomous AI Agents &amp; Workflows</text>

  <!-- Subtitle -->
  <text x="100" y="345" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Engineering self-driving systems with n8n, Make.com, Airtable &amp; AI
  </text>
  <text x="100" y="380" fill="#78716c" font-family="system-ui, -apple-system, sans-serif" font-size="22">
    Saving businesses 20+ hours weekly with FinOps &amp; Revenue Operations
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 440)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="280" height="85" rx="16" fill="#1c1917" stroke="#332c28" stroke-width="1.5" />
    <text x="24" y="36" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">97%</text>
    <text x="24" y="64" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="15">AR Recovery Time Saved</text>

    <!-- Metric 2 -->
    <rect x="310" y="0" width="280" height="85" rx="16" fill="#1c1917" stroke="#332c28" stroke-width="1.5" />
    <text x="334" y="36" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">20+ Hrs</text>
    <text x="334" y="64" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="15">Reclaimed Per Week</text>

    <!-- Metric 3 -->
    <rect x="620" y="0" width="280" height="85" rx="16" fill="#1c1917" stroke="#332c28" stroke-width="1.5" />
    <text x="644" y="36" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700">$7,000/mo</text>
    <text x="644" y="64" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="15">Client Value Created</text>
  </g>
</svg>
